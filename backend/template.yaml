AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GoNoGo - flood go/no-go alerts for Delhi underpasses

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ""
  TelegramBotUsername:
    Type: String
    Default: ""
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
  BedrockModelId:
    Type: String
    Default: none
    Description: Claude model for the Anthropic SDK path, or "none" to use only Converse
  BedrockRegion:
    Type: String
    Default: ap-southeast-2
  BedrockConverseModelId:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
    Description: Bedrock model for Converse (Amazon Nova Pro reads images)
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email for a $5/month AWS cost alert.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        PHOTO_BUCKET: !Ref PhotoBucket
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_BOT_USERNAME: !Ref TelegramBotUsername
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        BEDROCK_CONVERSE_MODEL_ID: !Ref BedrockConverseModelId
        DYNAMODB_ENDPOINT_URL: ""  # set only for `sam local` (see local/env.json)
        ALLOW_REFRESH: ""  # "1" only locally; EventBridge runs the engine on AWS
        ALERT_TOPIC_ARN: !Ref AlertTopic

Resources:
  # Email alerts: one topic, per-subscriber filter policies (spot, lang, kind).
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: GoNoGo flood alerts

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-photos, Status: Enabled, ExpirationInDays: 30 }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:  # caps abuse and cost on the public API
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.api_handler
      Environment:
        Variables:
          REPORT_WORKER_FUNCTION: !Ref ReportWorkerFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref PhotoBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref ReportWorkerFunction }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertTopic
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Runs the slow Bedrock vision call outside API Gateway's 30 s limit.
  ReportWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.report_worker_handler
      Timeout: 180
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref PhotoBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-mantle:*
              Resource: "*"

  EngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.engine_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  # ---- Observability -------------------------------------------------------
  # The engine must run every 15 minutes; silence for an hour means alerts
  # have stopped, which for a safety service is the failure that matters most.
  EngineNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GoNoGo risk engine has not run in the last hour
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref EngineFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GoNoGo Lambda errors (API, engine or photo worker)
      Metrics:
        - Id: total
          Expression: api + engine + worker
          ReturnData: true
        - Id: api
          MetricStat: { Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }] }, Period: 900, Stat: Sum }
          ReturnData: false
        - Id: engine
          MetricStat: { Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref EngineFunction }] }, Period: 900, Stat: Sum }
          ReturnData: false
        - Id: worker
          MetricStat: { Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ReportWorkerFunction }] }, Period: 900, Stat: Sum }
          ReturnData: false
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: GoNoGo
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
             "properties": {"markdown": "# GoNoGo: flood go/no-go for Delhi underpasses\nRisk engine every 15 min (EventBridge) · alerts via Telegram · photo depth checks on Amazon Bedrock (Nova Pro)"}},
            {"type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
             "properties": {"title": "Flood spots by level", "region": "${AWS::Region}", "stat": "Maximum", "period": 900, "view": "timeSeries",
              "metrics": [["GoNoGo", "NoGoSpots", "Service", "gonogo", {"label": "Do not enter", "color": "#d62728"}],
                          ["GoNoGo", "RiskySpots", "Service", "gonogo", {"label": "Risky", "color": "#ff9900"}]]}},
            {"type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
             "properties": {"title": "Alerts sent and photo reports", "region": "${AWS::Region}", "stat": "Sum", "period": 900, "view": "timeSeries",
              "metrics": [["GoNoGo", "AlertsSent", "Service", "gonogo", {"label": "Telegram alerts"}],
                          ["GoNoGo", "PhotoReports", "Service", "gonogo", {"label": "Photo reports"}]]}},
            {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
             "properties": {"title": "Lambda invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 900, "view": "timeSeries",
              "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${EngineFunction}", {"label": "Risk engine"}],
                          ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}", {"label": "API"}],
                          ["AWS/Lambda", "Invocations", "FunctionName", "${ReportWorkerFunction}", {"label": "Photo worker"}]]}},
            {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
             "properties": {"title": "Errors and photo-check latency", "region": "${AWS::Region}", "period": 900, "view": "timeSeries",
              "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", {"stat": "Sum", "label": "API errors"}],
                          ["AWS/Lambda", "Errors", "FunctionName", "${EngineFunction}", {"stat": "Sum", "label": "Engine errors"}],
                          ["AWS/Lambda", "Duration", "FunctionName", "${ReportWorkerFunction}", {"stat": "Average", "label": "Photo check ms", "yAxis": "right"}]]}},
            {"type": "alarm", "x": 0, "y": 14, "width": 24, "height": 3,
             "properties": {"title": "Health", "alarms": ["${EngineNotRunningAlarm.Arn}", "${LambdaErrorsAlarm.Arn}"]}}
          ]
        }

  # ---- Website: private S3 bucket behind CloudFront (HTTPS) ---------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: GoNoGo website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200  # includes India
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:  # single-page app: unknown paths serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  CostAlert:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref Table
  AlertTopicArn:
    Value: !Ref AlertTopic
  WebUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/GoNoGo"
