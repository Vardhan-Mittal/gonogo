AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GoNoGo - flood go/no-go alerts for Delhi underpasses

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ""
  TelegramBotUsername:
    Type: String
    Default: ""
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
  BedrockModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
  BedrockRegion:
    Type: String
    Default: us-east-1
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email for a $5/month AWS cost alert.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        PHOTO_BUCKET: !Ref PhotoBucket
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_BOT_USERNAME: !Ref TelegramBotUsername
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        DYNAMODB_ENDPOINT_URL: ""  # set only for `sam local` (see local/env.json)

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-photos, Status: Enabled, ExpirationInDays: 30 }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.api_handler
      Environment:
        Variables:
          REPORT_WORKER_FUNCTION: !Ref ReportWorkerFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref PhotoBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref ReportWorkerFunction }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Runs the slow Bedrock vision call outside API Gateway's 30 s limit.
  ReportWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.report_worker_handler
      Timeout: 180
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref PhotoBucket }
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-mantle:*
              Resource: "*"

  EngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: gonogo.handlers.engine_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  CostAlert:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref Table
