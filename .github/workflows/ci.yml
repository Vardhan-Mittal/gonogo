name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests and SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/src/requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q backend/tests
      - name: Replay data matches the code
        run: |
          python backend/export_static.py
          git diff --exit-code -- frontend/public/static-data
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Lint the SAM template
        run: sam validate --lint --template backend/template.yaml --region ap-southeast-2

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
